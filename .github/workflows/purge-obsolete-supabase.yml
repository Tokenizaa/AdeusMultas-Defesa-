name: Purge obsolete Supabase project references
on: [push]
permissions:
  contents: write
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge and canonicalize
        env:
          OLD_HOST_B64: bGxteG5wZ2pweGN2eXJxamtmd2Iuc3VwYWJhc2UuY28=
          NEW_HOST: sgomwklorpzdwdubtmgg.supabase.co
        run: |
          set -euo pipefail
          OLD_HOST="$(printf '%s' "$OLD_HOST_B64" | base64 --decode)"
          python - <<'PY'
          import os
          from pathlib import Path
          old = os.environ['OLD_HOST']
          new = os.environ['NEW_HOST']
          for p in Path('.').rglob('*'):
              if not p.is_file() or any(x in p.parts for x in ('.git','node_modules','.vercel')):
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding='utf-8')

          app = Path('src/server/app.ts')
          s = app.read_text(encoding='utf-8')
          s = s.replace(
              "const supabaseEnvUrl = process.env.VITE_SUPABASE_URL || process.env.SUPABASE_URL || '';",
              "const supabaseEnvUrl = 'https://sgomwklorpzdwdubtmgg.supabase.co';",
          )
          app.write_text(s, encoding='utf-8')

          server = Path('src/server/db/supabase-server.ts')
          s = server.read_text(encoding='utf-8')
          old_block = """  const url =
    process.env.VITE_SUPABASE_URL ||
    configService.get('VITE_SUPABASE_URL') ||
    process.env.SUPABASE_URL ||
    configService.get('SUPABASE_URL');"""
          s = s.replace(old_block, "  const url = 'https://sgomwklorpzdwdubtmgg.supabase.co';")
          server.write_text(s, encoding='utf-8')
          PY

          cat > vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "env": {
              "SUPABASE_URL": "https://sgomwklorpzdwdubtmgg.supabase.co",
              "VITE_SUPABASE_URL": "https://sgomwklorpzdwdubtmgg.supabase.co"
            },
            "build": {
              "env": {
                "SUPABASE_URL": "https://sgomwklorpzdwdubtmgg.supabase.co",
                "VITE_SUPABASE_URL": "https://sgomwklorpzdwdubtmgg.supabase.co"
              }
            }
          }
          EOF

          if git grep -n -I "$OLD_HOST" -- ':!.github/workflows/purge-obsolete-supabase.yml'; then
            echo 'Obsolete host remains'; exit 1
          fi

          rm -f .github/workflows/purge-obsolete-supabase.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: remove obsolete Supabase project references'
          git push
