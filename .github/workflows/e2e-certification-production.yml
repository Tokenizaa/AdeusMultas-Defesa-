name: E2E Production Certification — Sequential Services

on:
  push:
    branches:
      - onboarding/manual-intake-greenfield
    paths:
      - 'tests/**'
      - 'src/core/**'
      - 'cloudflare/routes/cases.ts'
      - 'cloudflare/routes/ai.ts'
      - 'playwright.config.ts'
      - '.github/workflows/e2e-certification-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-production-certification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  defense-previa:
    name: Certify defesa_previa against production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: https://adeusmulta.defesai.com.br
      SUPABASE_URL: https://llmxnpgjpxcvyrqjkfwb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ALLOW_PERSISTENT_WRITES: 'true'
      E2E_SERVICE: defesa_previa
      E2E_TEST_RUN_ID: cert-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_RUN_ID: cert-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ALLOW_REAL_PAYMENT: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify production target and required secret
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAYWRIGHT_BASE_URL" = "https://adeusmulta.defesai.com.br"
          test "$SUPABASE_URL" = "https://llmxnpgjpxcvyrqjkfwb.supabase.co"
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing; refusing to run a production-writing test."
            exit 1
          }
          echo "Target fixed to production; no preview URL, deploy, migration, or real-payment mode."

      - name: Playwright discovery must be read-only and select only requested service
        run: |
          bunx playwright test --list --project=chromium-production \
            tests/onboarding-anonymous-production.spec.ts \
            tests/e2e-runner.spec.ts \
            tests/e2e/services/defesa_previa.spec.ts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run deterministic legal pipeline — defesa_previa
        run: bunx playwright test --project=chromium-production --workers=1 --retries=0 tests/e2e/services/defesa_previa.spec.ts

      - name: Run production anonymous onboarding smoke
        run: bunx playwright test --project=chromium-production --workers=1 --retries=0 tests/onboarding-anonymous-production.spec.ts

      - name: Run first production service battery — defesa_previa only
        run: bunx playwright test --project=chromium-production --workers=1 --retries=0 tests/e2e-runner.spec.ts

      - name: Upload execution evidence and cleanup reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-certification-defesa-previa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e-results/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
