name: Finalize Production Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'Tokenizaa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and commit hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          def replace(path, old, new, expected=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n != expected: raise SystemExit(f'{path}: expected {expected}, found {n}: {old!r}')
              p.write_text(s.replace(old,new))
          replace('src/server/routes/admin.ts', ".select('id, email, name, role, cpf, created_at, updated_at')", ".select('user_id, email, name, role, cpf, created_at, updated_at')", 2)
          replace('src/server/routes/admin.ts', ".select('id, email, name, role')", ".select('user_id, email, name, role')", 1)
          replace('src/server/routes/admin.ts', ".eq('id', profile.id)", ".eq('user_id', profile.user_id)", 1)
          replace('src/server/app.ts', "  const app = express();\n  const isProd = process.env.NODE_ENV === 'production';", "  const app = express();\n  const isProd = process.env.NODE_ENV === 'production';\n  app.set('trust proxy', process.env.VERCEL === '1' ? 1 : false);", 1)
          replace('src/server/app.ts', "const metaAdminPath = /^\\/(?:integrations\\/meta|meta)\\/(?:debug-app|debug-token|connect|select-targets|disconnect|publish|insights)$/.test(req.path);", "const metaAdminPath = /^\\/(?:integrations\\/meta|meta)\\/(?:debug-app|debug-token|connect|select-targets|disconnect|publish|insights|tests|webhooks\\/history|webhook\\/history)$/.test(req.path);", 1)
          p=Path('src/server/routes/payments.ts'); s=p.read_text()
          marker="function prodAuth(req: Request, res: Response, next: NextFunction): void {\n"
          if s.count(marker)!=1: raise SystemExit('payments.ts prodAuth marker mismatch')
          helper="""function validatePayerIdentity(name: unknown, email: unknown, cpf: unknown): { name: string; email: string; cpf: string } | null {\n  const normalizedName = typeof name === 'string' ? name.trim() : '';\n  const normalizedEmail = typeof email === 'string' ? email.trim() : '';\n  const normalizedCpf = typeof cpf === 'string' ? cpf.replace(/\\D/g, '') : '';\n  const emailValid = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(normalizedEmail);\n  if (!normalizedName || !emailValid || normalizedCpf.length !== 11) return null;\n  return { name: normalizedName, email: normalizedEmail, cpf: normalizedCpf };\n}\n\n"""
          p.write_text(s.replace(marker,helper+marker))
          replace('src/server/routes/payments.ts', "    // CPF do pagador é obrigatório — rejeitar request sem CPF válido (fail-closed).\n    // Não usar fallback com CPF inventado ('12345678909') — viola integridade do pagamento PIX.\n    const cleanCpf = (customerCpf || '').replace(/\\D/g, '');\n    if (cleanCpf.length !== 11) {\n      return res.status(400).json({\n        error: 'CPF do pagador é obrigatório para criação do pagamento PIX.',\n        hint: 'Informe o campo customerCpf com CPF válido (11 dígitos).',\n      });\n    }", "    const payer = validatePayerIdentity(customerName, customerEmail, customerCpf);\n    if (!payer) return res.status(400).json({ error: 'Nome, email e CPF válidos do pagador são obrigatórios para criação do pagamento PIX.' });", 1)
          replace('src/server/routes/payments.ts', "        name: customerName || 'Condutor DefesAi',\n        email: customerEmail || 'contato@www.defesai.shop',\n        document: cleanCpf,", "        name: payer.name,\n        email: payer.email,\n        document: payer.cpf,", 1)
          replace('src/server/routes/payments.ts', "    // CPF do pagador é obrigatório — fail-closed (não usar fallback inventado).\n    const cleanCpfCC = (customerCpf || '').replace(/\\D/g, '');\n    if (cleanCpfCC.length !== 11) {\n      return res.status(400).json({\n        error: 'CPF do pagador é obrigatório para pagamento com cartão de crédito.',\n        hint: 'Informe o campo customerCpf com CPF válido (11 dígitos).',\n      });\n    }", "    const payer = validatePayerIdentity(customerName, customerEmail, customerCpf);\n    if (!payer) return res.status(400).json({ error: 'Nome, email e CPF válidos do pagador são obrigatórios para pagamento com cartão de crédito.' });", 1)
          replace('src/server/routes/payments.ts', "        name: customerName || 'Condutor DefesAi',\n        email: customerEmail || 'contato@www.defesai.shop',\n        taxId: cleanCpfCC,", "        name: payer.name,\n        email: payer.email,\n        taxId: payer.cpf,", 1)
          PY

          cat > tests/unit/production-hardening-p0.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.cwd();
          const read = (file: string) => fs.readFileSync(path.join(root, file), 'utf8');
          describe('production hardening P0/P1', () => {
            it('uses user_id for user_profiles access', () => {
              const source = read('src/server/routes/admin.ts');
              expect(source).not.toContain(".select('id, email, name, role, cpf, created_at, updated_at')");
              expect(source).not.toContain(".select('id, email, name, role')");
              expect(source).not.toContain(".eq('id', profile.id)");
              expect(source).toContain(".select('user_id, email, name, role, cpf, created_at, updated_at')");
              expect(source).toContain(".eq('user_id', profile.user_id)");
            });
            it('does not contain synthetic payer fallbacks', () => {
              const source = read('src/server/routes/payments.ts');
              expect(source).not.toContain('Condutor DefesAi');
              expect(source).not.toContain('contato@www.defesai.shop');
              expect(source).not.toContain('12345678909');
              expect(source).toContain('validatePayerIdentity');
            });
            it('trusts exactly the Vercel proxy hop only on Vercel', () => {
              expect(read('src/server/app.ts')).toContain("app.set('trust proxy', process.env.VERCEL === '1' ? 1 : false);");
            });
            it('protects remaining Meta administrative diagnostics/history centrally', () => {
              const source = read('src/server/app.ts');
              expect(source).toContain('webhooks\\/history');
              expect(source).toContain('webhook\\/history');
              expect(source).toContain('|tests|');
            });
          });
          EOF

          rm -f .github/workflows/production-hardening-apply.yml .github/workflows/production-hardening-apply2.yml .github/workflows/production-hardening-finalize.yml docs/audit/PRODUCTION-HARDENING-TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/app.ts src/server/routes/admin.ts src/server/routes/payments.ts tests/unit/production-hardening-p0.test.ts .github/workflows/production-hardening-apply.yml .github/workflows/production-hardening-apply2.yml .github/workflows/production-hardening-finalize.yml docs/audit/PRODUCTION-HARDENING-TRIGGER.md
          git commit -m "fix(security,payments): harden production identity and proxy handling"
          git push origin HEAD:main
