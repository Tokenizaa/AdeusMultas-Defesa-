name: Onboarding — Anonymous Production Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: onboarding-anonymous-production
  cancel-in-progress: false

jobs:
  anonymous-gate:
    name: Anonymous onboarding → claim gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: https://adeusmulta.defesai.com.br
      E2E_TEST_EMAIL: ${{ secrets.USER_TEST_LOGIN }}
      E2E_TEST_PASSWORD: ${{ secrets.USER_TEST_PASSWORD }}
      E2E_RUN_ID: anonymous-${{ github.run_id }}
      # Keep production reconciliation on the same canonical project as Worker.
      SUPABASE_URL: https://llmxnpgjpxcvyrqjkfwb.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run package postinstall explicitly
        run: npm run postinstall

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production target
        run: node -e 'const u = new URL(process.env.PLAYWRIGHT_BASE_URL); if (u.protocol !== "https:" || u.hostname !== "adeusmulta.defesai.com.br") process.exit(1); console.log(u.origin)'

      - name: Run anonymous onboarding gate test
        run: npx playwright test tests/onboarding-anonymous-production.spec.ts --project=chromium-production --workers=1 --retries=0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anonymous-onboarding-production-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
