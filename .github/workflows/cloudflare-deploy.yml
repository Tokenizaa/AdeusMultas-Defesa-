name: Cloudflare Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'bun.lockb'
      - 'vitest.config.*'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'bun.lockb'
      - 'vitest.config.*'
      - 'scripts/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_MODE: real
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Ensure Vectorize index exists
        run: |
          # List indexes to verify we can authenticate and see if the index exists
          if ! bunx wrangler vectorize list; then
            echo "Failed to list Vectorize indexes. Check CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID permissions."
            exit 1
          fi
          # Check if our index exists
          if bunx wrangler vectorize list | grep -q adeusmulta-knowledge; then
            echo "Vectorize index 'adeusmulta-knowledge' already exists."
          else
            echo "Creating Vectorize index 'adeusmulta-knowledge'..."
            if ! bunx wrangler vectorize create adeusmulta-knowledge --dimensions=768 --metric=cosine; then
              echo "Failed to create Vectorize index. Check permissions."
              exit 1
            fi
          fi

      - name: Test Phase 8 persistence
        run: bunx vitest run cloudflare/routes/notifications.test.ts

      - name: Build and deploy to Cloudflare
        run: bunx wrangler@latest deploy --config wrangler.jsonc
