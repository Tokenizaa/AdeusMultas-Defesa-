name: Deploy Adeus Multa to Cloudflare

# Cloudflare production deploy workflow; changes to this file intentionally trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "cloudflare/**"
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "vite.config.*"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_MODE: real
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Test Phase 8 persistence
        run: bunx vitest run cloudflare/routes/notifications.test.ts

      - name: Build and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@latest deploy --config wrangler.jsonc
