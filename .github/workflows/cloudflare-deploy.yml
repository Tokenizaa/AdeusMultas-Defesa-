# Cloudflare production deploy + authoritative migration gates
# Phase 11 uses Env.FETCH only in tests; production falls back to Worker fetch.
name: Cloudflare Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'bun.lockb'
      - 'vitest.config.*'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'bun.lockb'
      - 'vitest.config.*'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/cloudflare-deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_API_MODE: real
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Ensure Vectorize index exists
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-PRODUCTION]')
        run: |
          if ! bunx wrangler vectorize list; then
            echo "Failed to list Vectorize indexes. Check CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID permissions."
            exit 1
          fi
          if bunx wrangler vectorize list | grep -q adeusmulta-knowledge; then
            echo "Vectorize index 'adeusmulta-knowledge' already exists."
          else
            echo "Creating Vectorize index 'adeusmulta-knowledge'..."
            if ! bunx wrangler vectorize create adeusmulta-knowledge --dimensions=768 --metric=cosine; then
              echo "Failed to create Vectorize index. Check permissions."
              exit 1
            fi
          fi

      - name: Test Brazilian date normalization
        run: bunx vitest run src/lib/date-utils.test.ts

      - name: Discover canonical E2E matrix (read-only)
        env:
          PLAYWRIGHT_BASE_URL: https://adeusmulta.defesai.com.br
          E2E_ALLOW_PERSISTENT_WRITES: 'false'
          E2E_TEST_RUN_ID: ci-discovery-${{ github.sha }}
        run: |
          bun run test:e2e:list | tee /tmp/e2e-discovery.txt
          services="DEFESA_PREVIA RECURSO_JARI RECURSO_CETRAN SUSPENSAO CASSACAO INDICACAO_CONDUTOR CONVERSAO_ADVERTENCIA"
          for service in $services; do
            count=$(grep -Ec "E2E-${service}-(0[1-9]|10)( |$)" /tmp/e2e-discovery.txt || true)
            if [ "$count" -ne 10 ]; then
              echo "Expected 10 canonical scenarios for $service, found $count"
              exit 1
            fi
          done
          echo "Verified 70 canonical scenarios across 7 services (supplemental tests are counted separately)."

      - name: Test Phase 2 OCR
        run: bunx vitest run cloudflare/routes/ocr.test.ts

      - name: Test Phase 3 Knowledge
        run: bunx vitest run cloudflare/routes/knowledge.test.ts

      - name: Test Phase 4 AI
        run: bunx vitest run cloudflare/routes/ai.test.ts

      - name: Test Phase 5 Commercial
        run: bunx vitest run cloudflare/routes/commercial.test.ts

      - name: Test Phase 6 Documents
        run: bunx vitest run cloudflare/routes/documents.test.ts

      - name: Test Phase 9 Admin
        run: bunx vitest run cloudflare/routes/admin.test.ts cloudflare/routes/monitor.test.ts cloudflare/routes/audit.test.ts cloudflare/routes/settings.test.ts

      - name: Test Phase 8 persistence
        run: bunx vitest run cloudflare/routes/notifications.test.ts

      - name: Test Phase 10 marketing
        run: bunx vitest run cloudflare/routes/marketing.test.ts

      - name: Test Phase 11 WhatsApp communication
        run: bunx vitest run cloudflare/routes/communication.test.ts


      - name: Test Phase 6 Payments
        run: bunx vitest run cloudflare/routes/payments.test.ts

      - name: Test VenoPag payment lifecycle regressions
        run: bunx vitest run cloudflare/routes/payments.regression.test.ts

      - name: Test Phase 13 AI observability
        run: bunx vitest run cloudflare/routes/admin.ai-metrics.test.ts

      - name: Test anonymous onboarding and recovery API contracts
        run: bunx vitest run cloudflare/routes/cases.test.ts

      - name: Build frontend assets (dist/)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-PRODUCTION]')
        run: bun run build

      - name: Build and deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[DEPLOY-PRODUCTION]')
        run: bunx wrangler@latest deploy --config wrangler.jsonc
