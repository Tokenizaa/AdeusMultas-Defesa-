name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

jobs:
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm (Arborist fix)
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit/audit tests (vitest)
        run: npm run test:unit
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    env:
      PLAYWRIGHT_BASE_URL: https://adeusmulta.defesai.com.br
      E2E_TEST_EMAIL: ${{ secrets.USER_TEST_LOGIN }}
      E2E_TEST_PASSWORD: ${{ secrets.USER_TEST_PASSWORD }}
      E2E_RUN_ID: ci-${{ github.run_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm (Arborist fix)
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E (Playwright)
        run: npm test

  production-golden-path:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[PHASE4-RUN]')
    uses: ./.github/workflows/golden-path-production.yml
    secrets: inherit
