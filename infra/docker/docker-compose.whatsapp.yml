# =============================================================================
# DefesAi — Docker Compose for WhatsApp (Evolution API)
# =============================================================================
#
# Setup:
#   cd infra/docker
#   docker compose up -d
#
# Access Evolution API Manager:
#   http://localhost:8080/manager
#   API Key: (from .env → EVOLUTION_API_KEY)
#
# Connect WhatsApp:
#   1. Open Manager → Instances → Create
#   2. Scan QR code with WhatsApp app
#   3. Instance status should show "open"
#
# Webhook URL (for incoming messages):
#   http://host.docker.internal:3000/api/webhooks/whatsapp
#
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Evolution API — WhatsApp Business Gateway
  # ---------------------------------------------------------------------------
  evolution:
    image: evoapicloud/evolution-api:v2.1.1
    container_name: defesai-whatsapp
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      # Server
      - SERVER_URL=${EVOLUTION_URL:-http://localhost:8080}
      - SERVER_PORT=8080
      - SERVER_TYPE=http

      # Authentication
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me-in-production}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Database (PostgreSQL)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution_pass}@evolution-db:5432/evolution

      # Cache (Redis)
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - CACHE_REDIS_PREFIX_KEY=defesai

      # Webhooks
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${APP_WEBHOOK_URL:-http://host.docker.internal:3000/api/webhooks/whatsapp}
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true

      # Storage
      - S3_ENABLED=false

      # Logs
      - LOG_LEVEL=${LOG_LEVEL:-WARN}
      - LOG_COLOR=true

      # Delivery settings
      - DELIVERY_RETRY_INTERVAL=5000
      - DELIVERY_RETRY_MAX=5
      - DELIVERY_WEBHOOK_TIMEOUT=10000

    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - defesai-network

  # ---------------------------------------------------------------------------
  # PostgreSQL for Evolution API
  # ---------------------------------------------------------------------------
  evolution-db:
    image: postgres:16-alpine
    container_name: defesai-whatsapp-db
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_pass}
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - defesai-network

  # ---------------------------------------------------------------------------
  # Redis for Evolution API caching
  # ---------------------------------------------------------------------------
  evolution-redis:
    image: redis:7-alpine
    container_name: defesai-whatsapp-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - defesai-network

volumes:
  evolution_instances:
  evolution_store:
  evolution-pgdata:
  evolution-redis:

networks:
  defesai-network:
    driver: bridge
