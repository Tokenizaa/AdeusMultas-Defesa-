# =============================================================================
# DefesAi — Docker Compose for WhatsApp (Evolution API)
# =============================================================================
#
# Setup:
#   cd infra/docker
#   docker compose up -d
#
# Access Evolution API Manager:
#   http://localhost:8080/manager
#   API Key: (from .env → EVOLUTION_API_KEY)
#
# Connect WhatsApp:
#   1. Open Manager → Instances → Create
#   2. Scan QR code with WhatsApp app
#   3. Instance status should show "open"
#
# Webhook URL (for incoming messages):
#   http://host.docker.internal:3000/api/webhooks/whatsapp
#
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Evolution API — WhatsApp Business Gateway
  # ---------------------------------------------------------------------------
  evolution:
    # v2.1.1 could not pair with current WhatsApp (Baileys noise handshake
    # "Connection Failure" loop, QR never generated - GH #2184/#2437).
    # v2.3.7 ships updated Baileys/WPPConnect that connects to current WhatsApp.
    image: evoapicloud/evolution-api:latest
    container_name: defesai-whatsapp
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      # Server
      - SERVER_URL=${EVOLUTION_URL:-http://localhost:8080}
      - SERVER_PORT=8080
      - SERVER_TYPE=http

      # QR Code configuration (fix for QR generation issues - see GH #2437/#2385)
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754

      # Instance / phone session configuration
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1033773198
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome

      # Authentication
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-change-me-in-production}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Database (PostgreSQL)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution_pass}@evolution-db:5432/evolution

      # Cache (workaround for QR/pre-key timeout - see GH #2437)
      # Disable Redis + history sync to avoid CPU/RAM choke on QR generation
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - DATABASE_SAVE_DATA_LABELS=false

      # Webhooks
      # NOTA (Linux): host.docker.internal so resolve com extra_hosts abaixo
      # (host-gateway). Sem isso o container nao alcanca o servidor do host e o
      # webhook nunca entrega. Em producao use APP_WEBHOOK_URL publica/HTTPS.
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=${APP_WEBHOOK_URL:-http://host.docker.internal:3000/api/webhooks/whatsapp}
      # byEvents=false => entrega no URL exato (sem sufixo /EVENTO), casando com
      # o handler POST /api/webhooks/whatsapp. Habilitar byEvents exigiria rotas
      # /api/webhooks/whatsapp/{EVENTO}.
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true

      # Storage
      - S3_ENABLED=false

      # Logs
      - LOG_LEVEL=${LOG_LEVEL:-WARN}
      - LOG_COLOR=true
      - LOG_BAILEYS=debug

      # Delivery settings
      - DELIVERY_RETRY_INTERVAL=5000
      - DELIVERY_RETRY_MAX=5
      - DELIVERY_WEBHOOK_TIMEOUT=10000

      # Force IPv4 DNS resolution (fixes WhatsApp "Connection Failure" / QR loop)
      # Combined with sysctl IPv6 disable - see GH #2184
      - NODE_OPTIONS=--dns-result-order=ipv4first

    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    extra_hosts:
      # Resolve host.docker.internal no Linux (sem isso o webhook p/ o servidor
      # do host nao entrega). host-gateway = IP do host.
      - "host.docker.internal:host-gateway"
    sysctls:
      # Force IPv4: host has no global IPv6 route, so Baileys WS to WhatsApp
      # hangs on IPv6 AAAA and fails with "Connection Failure" (noise decodeFrame).
      # Disabling IPv6 makes Node fall back to IPv4 -> QR generation works.
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - defesai-network

  # ---------------------------------------------------------------------------
  # PostgreSQL for Evolution API
  # ---------------------------------------------------------------------------
  evolution-db:
    image: postgres:16-alpine
    container_name: defesai-whatsapp-db
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution_pass}
    volumes:
      - evolution-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - defesai-network

  # ---------------------------------------------------------------------------
  # Redis for Evolution API caching
  # ---------------------------------------------------------------------------
  evolution-redis:
    image: redis:7-alpine
    container_name: defesai-whatsapp-redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - evolution-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - defesai-network

volumes:
  evolution_instances:
  evolution_store:
  evolution-pgdata:
  evolution-redis:

networks:
  defesai-network:
    driver: bridge
