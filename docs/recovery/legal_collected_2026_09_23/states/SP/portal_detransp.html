	background: #EAECEE;
	border: .1rem solid #D3D8DB;

	transition: .2s;

.detranui-responsive-modal-backdrop.ng-leave-active {
	opacity: 0;
	transition: .25s;
}
@keyframes modal-scale {
		from {
		opacity: 0;
		transform: scale(.95);
	}
		to {
		opacity: 1;
		transform: scale(1);
	}
	}
@media (max-width: 768px) {
	.detranui-responsive-modal-backdrop {
		align-items: flex-end;
	}
	.detranui-responsive-modal {
		width: 100%;
		max-width: none;
		max-height: 90vh;
		border-radius: 2.4rem 2.4rem 0 0;
		transform: translateY(100%);
		transition: transform .25s ease;
	}
	.is-open .detranui-responsive-modal {
		transform: translateY(0);
	}
	.detranui-responsive-modal {
		animation: modal-sheet .25s ease;
	}
	.detranui-responsive-modal__close {
		position: absolute;
		top: 1.6rem;
		right: 1.6rem;
	}
}
.detranui-skeleton {
	background: linear-gradient(90deg, #e0e0e0 25%, #f5f5f5 50%, #e0e0e0 75%);
	background-size: 200% 100%;
	animation: shimmer 1.2s infinite;
	opacity: .4;
}
@keyframes shimmer {
		0% {
		background-position: -200% 0;
	}
		100% {
		background-position: 200% 0;
	}
	}
