<script type="text/javascript">
function recaptchaCallback() 
{
    $('#enviar').removeAttr('disabled');
};
  
$(function() 
{
    $('form#VerificacaoConsultarForm').submit(function(event)
    {
        if($("#CrVerificacaoGruServicoBaixarCertificado").val() != 1)
        {
            $("#loading").show();
            $("#enviar").prop('disabled', true);
        }
    });

    $("input[name='data[Formulario][situacao_veiculo]']").click(function()
    {
        $("#CrVerificacaoGruServicoVeiculoPlaca").val('');
        $("#CrVerificacaoGruServicoVeiculoChassi").val('');
        $("#CrVerificacaoGruServicoVeiculoRenavam").val('');
        $("#enviar").html('Buscar');
        $("#CrVerificacaoGruServicoBaixarCertificado").val("");

        // se for consultar certificado de veículo emplacado
        if($(this).val() == 1)
        {
            $("#divPlaca").show();
            $("#CrVerificacaoGruServicoVeiculoPlaca").prop('required',true);

            $("#divChassi").hide();
            $("#CrVerificacaoGruServicoVeiculoChassi").prop('required',false);

            $("#divRenavam").hide();
            $("#CrVerificacaoGruServicoVeiculoRenavam").prop('required',false);
        }
        // se for consultar certificado de veículo não emplacado / internacional
        else if($(this).val() == 2)
        {
            $("#divPlaca").hide();
            $("#CrVerificacaoGruServicoVeiculoPlaca").prop('required',false);

            $("#divChassi").show();
            $("#CrVerificacaoGruServicoVeiculoChassi").prop('required',true);

            $("#divRenavam").hide();
            $("#CrVerificacaoGruServicoVeiculoRenavam").prop('required',false);
        }
        // se for download do certificado de veículo emplacado
        else if($(this).val() == 3)
        {
            $("#divPlaca").show();
            $("#CrVerificacaoGruServicoVeiculoPlaca").prop('required',true);

            $("#divChassi").hide();
            $("#CrVerificacaoGruServicoVeiculoChassi").prop('required',false);

            $("#divRenavam").show();
            $("#CrVerificacaoGruServicoVeiculoRenavam").prop('required',true);

            $("#enviar").html('Baixar');
            $("#CrVerificacaoGruServicoBaixarCertificado").val("1");
        }
        // se for download do certificado de veículo não emplacado / internacional
        else if($(this).val() == 4)
        {
            $("#divPlaca").hide();
            $("#CrVerificacaoGruServicoVeiculoPlaca").prop('required',false);

            $("#divChassi").show();
            $("#CrVerificacaoGruServicoVeiculoChassi").prop('required',true);

            $("#divRenavam").hide();
            $("#CrVerificacaoGruServicoVeiculoRenavam").prop('required',false);

            $("#enviar").html('Baixar');
            $("#CrVerificacaoGruServicoBaixarCertificado").val("1");
        }
    });

    var $post = "";

    if($post == "1")
    {
        // se for consultar certificado de veículo emplacado
        if($("input[name='data[Formulario][situacao_veiculo]']:checked" ).val() == 1)
        {
            $("#divPlaca").show();
            $("#divChassi").hide();
            $("#divRenavam").hide();
        }
        // se for consultar certificado de veículo não emplacado / internacional
        else if($("input[name='data[Formulario][situacao_veiculo]']:checked" ).val() == 2)
        {
            $("#divPlaca").hide();
            $("#divChassi").show();
            $("#divRenavam").hide();
        }
        // se for download do certificado de veículo emplacado
        else if($("input[name='data[Formulario][situacao_veiculo]']:checked" ).val() == 3)
        {
            $("#divPlaca").show();
            $("#divChassi").hide();
            $("#divRenavam").show();
        }
        // se for download do certificado de veículo não emplacado / internacional
        else if($("input[name='data[Formulario][situacao_veiculo]']:checked" ).val() == 4)
        {
            $("#divPlaca").hide();
            $("#divChassi").show();
            $("#divRenavam").hide();
        }
    }
});
</script>            </div>

$(document).ready(function () {
    $('.maskUsername').mask('00000000000000');

    $('.maskCep').mask('00000-000');
    $('.maskNumDocumento').mask('00000000000000000A');

    $('.maskLinhaDigitavel').mask('00000.00000 00000.000000 00000.000000 0 00000000000000');
    $('.maskDecimal1').mask('##0.0', {maxlength: false, reverse: true});
    $('.maskDecimal2').mask('##0.00', {maxlength: false, reverse: true});
    $('.maskDecimal3').mask('##0.000', {maxlength: false, reverse: true});
    $('.maskDecimal4').mask('##0.0000', {maxlength: false, reverse: true});
    $('.maskDecimal5').mask('##0.00000', {maxlength: false, reverse: true});
    $('.maskDecimal6').mask('##0.000000', {maxlength: false, reverse: true});
    $('.maskDecimal8').mask('##0.00000000', {maxlength: false, reverse: true});
    $('.maskHora').mask('AB:CD', {'translation': {
            A: {pattern: /[0-2]/},
            B: {pattern: /[0-9]/},
            C: {pattern: /[0-5]/},
            D: {pattern: /[0-9]/}
          }
    });
    $('.placaBrasil').mask('AAA0B00', {'translation': {
            A: {pattern: /[a-zA-Z]/},
            0: {pattern: /[0-9*]/},
            B: {pattern: /[0-9a-zA-Z]/}
          }
    });
    $('.placaGeral').mask('0000000000', {'translation': {
            0: {pattern: /^[a-zA-Z0-9]*$/}            
          }
    });
    $('.placaGeralSemEspacos').mask('0000000000', {'translation': {
            0: {pattern: /^[a-zA-Z0-9]*$/}            
          }
    });

    $('.maskChassiSemEspacos').mask('00000000000000000000000', {'translation': {
            0: {pattern: /^[a-zA-Z0-9]*$/}            
          }
    });

    $('.NumSerieInstrumentoSemEspacos').mask('00000000000000000000', {'translation': {
            0: {pattern: /^[a-zA-Z0-9]*$/}            
          }
    });  

    $('.maskAno').mask('0000');
    $('.maskNumero8').mask('00000000');
    $('.maskNumero5').mask('00000');
    $('.maskNumero8').mask('00000000');
    $('.maskNumero10').mask('0000000000');
    $('.maskCpf').mask('00000000000');
    $('.maskCnpj').mask('SSSSSSSSSSSSSS', {
        translation: {
            'S': {
                pattern: /[A-Za-z0-9]/
            }
        }
    }).on('input', function () {
        $(this).val($(this).val().toUpperCase());
    });
    $('.maskNumero24').mask('000000000000000000000000');
    $('.maskPlacaNumeros').mask('0000');
	$('.maskDeclaracaoProtocolo').mask('000000000000000000');

    var SPMaskBehavior = function (val) 
    {
        return val.replace(/\D/g, '').length === 11 ? '(00) 00000-0000' : '(00) 0000-00009';
    },
    spOptions = 
    {
        onKeyPress: function(val, e, field, options) 
        {
            field.mask(SPMaskBehavior.apply({}, arguments), options);
        }
    };

    $('.maskTelefone').mask(SPMaskBehavior, spOptions);    
    $('.maskDecimalRegIrregular').mask('00.000', {maxlength: false, reverse: true});

    $('.maskDataValida').mask('AB/CD/0000', {
        'translation': {
            A: { pattern: /[0-3]/ },
            B: { pattern: /[0-9]/ },
            C: { pattern: /[0-1]/ },
            D: { pattern: /[0-9]/ }
        },
        onKeyPress: function(a, b, c, d) {
            if (!a) return;
            let m = a.match(/(\d{1})/g);
            if (!m) return;
            if (parseInt(m[0]) === 3) {
                d.translation.B.pattern = /[0-1]/;
            } else {
                d.translation.B.pattern = /[0-9]/;
            }
            if (parseInt(m[2]) == 1) {
                d.translation.D.pattern = /[0-2]/;
            } else {
                d.translation.D.pattern = /[0-9]/;
            }
            let temp_value = c.val();
            c.val('');
            c.unmask().mask('AB/CD/0000', d);
            c.val(temp_value);
        }
    });
});
