<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DefesAi — Modo Offline</title>
  <meta name="theme-color" content="#071D41">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #071D41;
      color: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(12, 50, 111, 0.6);
      border: 1px solid rgba(255, 205, 7, 0.3);
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px auto;
      background: linear-gradient(135deg, #155BCB, #071D41);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #FFCD07;
      color: #FFCD07;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #FFFFFF;
    }
    p {
      font-size: 15px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #FFCD07, #F5A623);
      color: #071D41;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }
    .btn:active {
      transform: translateY(0);
    }
    .status-badge {
      display: inline-block;
      margin-top: 18px;
      font-size: 12px;
      color: #CBD5E1;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚖️</div>
    <h1>Você está offline</h1>
    <p>A plataforma DefesAi requer conexão com a internet para gerar e autenticar recursos periciais com IA. Seus dados em cache permanecem seguros.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Tentar Reconectar
    </button>
    <div class="status-badge">
      ⚡ DefesAi PWA • Modo Seguro
    </div>
  </div>
</body>
</html>
