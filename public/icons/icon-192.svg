<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D41" />
      <stop offset="50%" stop-color="#0C326F" />
      <stop offset="100%" stop-color="#155BCB" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCD07" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Outer Shield Border -->
  <path d="M96 28 L146 48 C146 102 122 136 96 156 C70 136 46 102 46 48 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Shield Core -->
  <path d="M96 36 L138 52 C138 98 118 128 96 146 C74 128 54 98 54 52 Z" 
        fill="#071D41" 
        opacity="0.85" />

  <!-- Scales / Gavel AI Icon -->
  <g transform="translate(96, 92) scale(0.9)" filter="url(#glow)">
    <!-- Central Pillar -->
    <line x1="0" y1="-32" x2="0" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Cross Beam -->
    <line x1="-34" y1="-18" x2="34" y2="-18" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Left Scale -->
    <line x1="-30" y1="-18" x2="-38" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-30" y1="-18" x2="-22" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <path d="M-44 -2 Q-30 14 -16 -2 Z" fill="url(#goldGrad)" />
    <!-- Right Scale -->
    <line x1="30" y1="-18" x2="22" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <line x1="30" y1="-18" x2="38" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <path d="M16 -2 Q30 14 44 -2 Z" fill="url(#goldGrad)" />
    <!-- Base Plate -->
    <rect x="-18" y="24" width="36" height="6" rx="3" fill="url(#goldGrad)" />
    <!-- AI Sparkle -->
    <circle cx="0" cy="-34" r="5" fill="#FFCD07" />
  </g>
</svg>
