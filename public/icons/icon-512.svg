<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071D41" />
      <stop offset="45%" stop-color="#0C326F" />
      <stop offset="100%" stop-color="#155BCB" />
    </linearGradient>
    <linearGradient id="goldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCD07" />
      <stop offset="100%" stop-color="#F5A623" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Outer Shield Border -->
  <path d="M256 72 L392 128 C392 272 328 364 256 416 C184 364 120 272 120 128 Z" 
        fill="none" 
        stroke="url(#goldGrad512)" 
        stroke-width="14" 
        stroke-linejoin="round" />

  <!-- Shield Core -->
  <path d="M256 94 L370 140 C370 262 316 342 256 390 C196 342 142 262 142 140 Z" 
        fill="#071D41" 
        opacity="0.9" />

  <!-- Scales / Gavel AI Icon -->
  <g transform="translate(256, 246) scale(2.4)" filter="url(#glow512)">
    <!-- Central Pillar -->
    <line x1="0" y1="-32" x2="0" y2="24" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <!-- Cross Beam -->
    <line x1="-34" y1="-18" x2="34" y2="-18" stroke="url(#goldGrad512)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Left Scale -->
    <line x1="-30" y1="-18" x2="-38" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-30" y1="-18" x2="-22" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <path d="M-44 -2 Q-30 14 -16 -2 Z" fill="url(#goldGrad512)" />
    <!-- Right Scale -->
    <line x1="30" y1="-18" x2="22" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <line x1="30" y1="-18" x2="38" y2="-2" stroke="#E2E8F0" stroke-width="2" />
    <path d="M16 -2 Q30 14 44 -2 Z" fill="url(#goldGrad512)" />
    <!-- Base Plate -->
    <rect x="-18" y="24" width="36" height="6" rx="3" fill="url(#goldGrad512)" />
    <!-- AI Sparkle -->
    <circle cx="0" cy="-34" r="5" fill="#FFCD07" />
  </g>
</svg>
