<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 96" width="440" height="96" fill="none">
  <defs>
    <linearGradient id="amShieldGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C326F" />
      <stop offset="60%" stop-color="#155BCB" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="amGoldGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD027" />
      <stop offset="50%" stop-color="#FF9E1B" />
      <stop offset="100%" stop-color="#FF6B35" />
    </linearGradient>
    <linearGradient id="amOrangeGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A3D" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <filter id="amGlowD" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FFD027" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- EMBLEM ICON -->
  <g transform="translate(6, 6)">
    <!-- Outer Shield Background -->
    <path d="M42 4 L76 18 C76 58 58 76 42 84 C26 76 8 58 8 18 Z" fill="url(#amShieldGradD)" />
    <!-- Golden Border Line -->
    <path d="M42 4 L76 18 C76 58 58 76 42 84 C26 76 8 58 8 18 Z" fill="none" stroke="url(#amGoldGradD)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Scales Inside Shield -->
    <line x1="26" y1="36" x2="58" y2="36" stroke="url(#amGoldGradD)" stroke-width="2.8" stroke-linecap="round" />
    <line x1="42" y1="24" x2="42" y2="60" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    <path d="M33 60 L51 60" stroke="url(#amGoldGradD)" stroke-width="3" stroke-linecap="round" />
    <polygon points="42,20 45,24 42,28 39,24" fill="#FFD027" />

    <!-- Left Pan -->
    <line x1="29" y1="36" x2="23" y2="47" stroke="#CBD5E1" stroke-width="1.4" />
    <line x1="29" y1="36" x2="35" y2="47" stroke="#CBD5E1" stroke-width="1.4" />
    <path d="M20 47 Q29 55 38 47 Z" fill="url(#amGoldGradD)" />

    <!-- Right Pan -->
    <line x1="55" y1="36" x2="49" y2="47" stroke="#CBD5E1" stroke-width="1.4" />
    <line x1="55" y1="36" x2="61" y2="47" stroke="#CBD5E1" stroke-width="1.4" />
    <path d="M46 47 Q55 55 64 47 Z" fill="url(#amGoldGradD)" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(102, 10)">
    <text x="0" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="-0.03em">
      <tspan fill="#FFFFFF">Adeus</tspan>
      <tspan dx="8" fill="url(#amOrangeGradD)">Multas</tspan>
    </text>

    <text x="2" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.18em">
      DEFESA PERICIAL DE MULTAS &amp; CNH
    </text>

    <g transform="translate(290, 18)">
      <rect x="0" y="0" width="44" height="20" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="22" y="14" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" font-weight="800" fill="#F8FAFC" text-anchor="middle">
        CTB
      </text>
    </g>
  </g>
</svg>
